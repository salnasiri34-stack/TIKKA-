<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكة | Tikka</title>
    <!-- استيراد مكتبات Firebase عبر CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // إعدادات فايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyD-YOUR-API-KEY",
            authDomain: "tikka-c.firebaseapp.com",
            projectId: "tikka-c",
            storageBucket: "tikka-c.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ربط الدوال بالنافذة العامة لتتعامل الأزرار معها بسلاسة
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.doc = doc;
        window.updateDoc = updateDoc;
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d); 
            color: #f5f5f5; 
            direction: rtl; 
            padding: 30px 15px; 
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 764px; /* التصميم المطلوب بعرض 764 بكسل بدقة */
            margin: 0 auto; 
            background: #212121; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.7); 
            border: 1px solid #333;
        }
        h1 { text-align: center; color: #ff9800; margin-bottom: 25px; font-size: 28px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
        h2 { color: #ffb74d; margin-bottom: 15px; font-size: 20px; border-bottom: 2px solid #333; padding-bottom: 8px; }
        
        .btn { 
            width: 100%; 
            background: linear-gradient(135deg, #ff9800, #f57c00); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 12px; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255,152,0,0.3);
        }
        .btn:hover { background: linear-gradient(135deg, #f57c00, #e65100); transform: translateY(-2px); }
        
        input, select, textarea { 
            width: 100%; 
            padding: 12px 15px; 
            margin: 10px 0; 
            background: #2c2c2c; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 8px; 
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #ff9800; }

        .order-card { 
            background: #2a2a2a; 
            padding: 16px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            border-right: 5px solid #ff9800; 
            font-size: 15px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .order-card p { margin-bottom: 8px; line-height: 1.5; }
        
        .status-badge { 
            background: #ff9800; 
            color: #121212;
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: bold;
        }
        
        .logout-btn { 
            background: #d32f2f; 
            color: #fff; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: #b71c1c; }

        .section { display: none; }
        .active { display: block; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .menu-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #383838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تكة 🍔 | Tikka</h1>

        <!-- شاشة تسجيل الدخول / البداية -->
        <div id="loginSection" class="section active">
            <h2>تسجيل الدخول للنظام</h2>
            <p style="color: #aaa; margin-bottom: 15px; font-size: 14px;">أدخل بياناتك للمتابعة أو لوحة التحكم:</p>
            <input type="text" id="userName" placeholder="اسمك الكريم">
            <input type="tel" id="userPhone" placeholder="رقم الجوال">
            <button class="btn" onclick="login()">دخول</button>
        </div>

        <!-- شاشة العميل (الطلب ومتابعة الطلبات) -->
        <div id="clientSection" class="section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; background: #2c2c2c; padding: 12px 18px; border-radius: 10px;">
                <span id="welcomeUser" style="font-weight:bold; color:#ff9800; font-size: 16px;"></span>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>

            <h2>قائمة الطعام المميزة</h2>
            <div class="menu-grid">
                <div class="menu-item">
                    <p style="font-weight: bold; font-size: 17px; margin-bottom: 5px;">وجبة تكة مالح</p>
                    <p style="color: #ff9800; margin-bottom: 10px; font-weight: bold;">35 ريال</p>
                    <button class="btn" style="padding: 8px; font-size: 14px; margin-top: 0;" onclick="sendOrder('وجبة تكة مالح', '35 ريال')">طلب الآن</button>
                </div>
                <div class="menu-item">
                    <p style="font-weight: bold; font-size: 17px; margin-bottom: 5px;">وجبة تكا ملكي</p>
                    <p style="color: #ff9800; margin-bottom: 10px; font-weight: bold;">35 ريال</p>
                    <button class="btn" style="padding: 8px; font-size: 14px; margin-top: 0;" onclick="sendOrder('وجبة تكا ملكي', '35 ريال')">طلب الآن</button>
                </div>
            </div>

            <h2 style="margin-top: 30px;">طلباتي السابقة</h2>
            <div id="historyContainer">
                <p style="color:#777; text-align:center; padding: 15px;">جاري تحميل الطلبات...</p>
            </div>
        </div>

        <!-- شاشة لوحة تحكم الإدارة -->
        <div id="adminSection" class="section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; background: #2c2c2c; padding: 12px 18px; border-radius: 10px;">
                <span style="color:#ff9800; font-weight:bold; font-size: 16px;">لوحة تحكم الإدارة ⚙️</span>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>

            <h2>الطلبات الواردة</h2>
            <div id="adminOrdersList">
                <p style="color:#777; text-align:center; padding: 15px;">لا توجد طلبات.</p>
            </div>

            <h2 style="margin-top: 30px;">سجل العملاء للواتساب</h2>
            <div id="adminRoutingList" style="background: #272727; padding: 15px; border-radius: 10px;">
                <p style="color:#777; text-align:center;">لا توجد أرقام.</p>
            </div>
        </div>
    </div>

    <script>
        let currentPhone = "";
        let currentName = "";

        function login() {
            currentName = document.getElementById('userName').value.trim();
            currentPhone = document.getElementById('userPhone').value.trim();

            if (!currentName || !currentPhone) {
                alert("الرجاء إدخال الاسم ورقم الجوال");
                return;
            }

            document.getElementById('loginSection').classList.remove('active');

            // تحقق إذا كان حساب مدير
            if (currentPhone === "0000" || currentName === "admin") {
                document.getElementById('adminSection').classList.add('active');
            } else {
                document.getElementById('clientSection').classList.add('active');
                document.getElementById('welcomeUser মহাশয়' || 'welcomeUser').innerText = `أهلاً بك، ${currentName}`;
            }
            
            initFirestoreListener();
        }

        function logout() {
            location.reload();
        }

        async function sendOrder(itemName, itemPrice) {
            if (!window.db) {
                alert("جاري الاتصال بقاعدة البيانات، حاول بعد قليل.");
                return;
            }
            try {
                await window.addDoc(window.collection(window.db, "orders"), {
                    customerName: currentName,
                    customerPhone: currentPhone,
                    item: itemName,
                    price: itemPrice,
                    status: "قيد المراجعة 🕒",
                    time: new Date().toISOString()
                });
                alert("تم إرسال طلبك بنجاح! 🎉");
            } catch (e) {
                console.error("خطأ في إرسال الطلب: ", e);
                alert("حدث خطأ أثناء إرسال الطلب.");
            }
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                const orderRef = window.doc(window.db, "orders", orderId);
                await window.updateDoc(orderRef, { status: newStatus });
            } catch (e) {
                console.error("خطأ في تحديث الحالة: ", e);
            }
        }

        function initFirestoreListener() {
            const checkInterval = setInterval(() => {
                if (window.db && window.onSnapshot && window.collection) {
                    clearInterval(checkInterval);
                    
                    window.onSnapshot(window.collection(window.db, "orders"), (snapshot) => {
                        let historyHtml = "";
                        let adminOrdersHtml = "";
                        let adminRoutingHtml = "";
                        let myOrders = [];

                        snapshot.forEach(docSnap => {
                            let order = docSnap.data();
                            order.id = docSnap.id;

                            // دعم مرن لأسماء الحقول (item / items)
                            let rawItem = order.item || order.items;
                            let itemsListText = "";
                            if (Array.isArray(rawItem)) {
                                itemsListText = rawItem.map(i => `${i.name || 'منتج'} (×${i.qty || 1})`).join('، ');
                            } else {
                                itemsListText = rawItem || "طلب خاص";
                            }

                            let orderPhone = order.customerPhone || order.phone || "";
                            if (orderPhone === currentPhone || !orderPhone) {
                                myOrders.push(order);
                            }

                            let cName = order.customerName || order.name || "عميل تكة";
                            let cPhone = orderPhone || "غير متوفر";
                            let cLocation = order.location || order.address || "العنوان غير محدد";
                            let cPrice = order.totalPrice || order.price || "0";
                            
                            adminOrdersHtml += `
                                <div class="order-card">
                                    <p><b>العميل:</b> ${cName} (${cPhone})</p>
                                    <p><b>الطلبات:</b> ${itemsListText}</p>
                                    <p><b>الموقع:</b> ${cLocation}</p>
                                    <p><b>المبلغ:</b> ${cPrice}</p>
                                    <p style="margin-top:8px;"><b>الحالة:</b> <span class="status-badge">${order.status || 'قيد المراجعة 🕒'}</span></p>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="logout-btn" style="background:#0288d1;" onclick="updateOrderStatus('${order.id}', 'جاري التوصيل 🛵')">جاري التوصيل</button>
                                        <button class="logout-btn" style="background:#388e3c;" onclick="updateOrderStatus('${order.id}', 'تم التوصيل بنجاح ✅')">تم التوصيل</button>
                                    </div>
                                </div>
                            `;

                            adminRoutingHtml += `
                                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #333; font-size:14px;">
                                    <span><b>${cName}</b> (${cPhone})</span>
                                    <a href="https://wa.me/966${cPhone.replace(/^0/, '')}?text=${encodeURIComponent('مرحباً يا ' + cName + '، بخصوص طلبك من تكة 🛵')}" target="_blank" style="background:#25d366; color:#fff; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:13px; font-weight:bold;">واتساب 🟢</a>
                                </div>
                            `;
                        });

                        if (myOrders.length === 0) {
                            historyHtml = "<p style='color: #777; text-align:center; padding: 15px;'>لا توجد طلبات سابقة.</p>";
                        } else {
                            myOrders.forEach(o => {
                                let cPrice = o.totalPrice || o.price || "0";
                                let rawItem = o.item || o.items;
                                let itemsTxt = Array.isArray(rawItem) ? rawItem.map(i => `${i.name || 'منتج'} (×${i.qty || 1})`).join('، ') : (rawItem || "طلب خاص");
                                historyHtml += `
                                    <div class="order-card">
                                        <p><b>رقم الطلب:</b> ${o.id.slice(0,6)}</p>
                                        <p><b>المنتجات:</b> ${itemsTxt}</p>
                                        <p><b>المبلغ:</b> ${cPrice}</p>
                                        <p style="margin-top:8px;"><b>الحالة:</b> <span class="status-badge">${o.status || 'قيد المراجعة 🕒'}</span></p>
                                    </div>
                                `;
                            });
                        }

                        document.getElementById('historyContainer').innerHTML = historyHtml;
                        document.getElementById('adminOrdersList').innerHTML = adminOrdersHtml || "<p style='color:#777; text-align:center; padding: 15px;'>لا توجد طلبات.</p>";
                        document.getElementById('adminRoutingList').innerHTML = adminRoutingHtml || "<p style='color:#777; text-align:center; padding: 15px;'>لا توجد أرقام.</p>";
                    });
                }
            }, 500);
        }
    </script>
</body>
</html>
