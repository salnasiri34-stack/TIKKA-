<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكة ماركت - نظام إدارة الطلبات المتقدم</title>
    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #2e7d32;
            --accent: #ff8f00;
            --accent-hover: #e65100;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.03);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .main-content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 75vh;
        }

        .view-section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .view-section.active {
            display: block;
            opacity: 1;
        }

        /* تصميم الأقسام (Categories Grid) */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .category-card {
            background: #ffffff;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: 2px solid var(--border-color);
            transition: var(--transition);
        }

        .category-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.12);
        }

        .category-card.selected {
            border-color: var(--primary);
            background-color: #f1f8f1;
        }

        .category-img-box {
            width: 100%;
            height: 100px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .category-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .category-card span {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-main);
        }

        /* قائمة المنتجات */
        .products-container {
            margin-bottom: 25px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: var(--transition);
        }

        .product-item:hover {
            border-color: #ced4da;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .product-info h4 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .product-info p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        /* الأزرار العامة */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        .btn-accent {
            background: var(--accent);
        }

        .btn-accent:hover {
            background: var(--accent-hover);
        }

        .btn-block {
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }

        /* قسم السلة */
        .cart-section {
            background: #ffffff;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-top: 15px;
        }

        .cart-items-list {
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-left: 5px;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            padding: 6px 0;
            border-bottom: 1px solid #f1f3f5;
        }

        .cart-row:last-child {
            border-bottom: none;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 15px;
            padding-top: 10px;
            border-top: 2px solid var(--border-color);
            color: var(--primary);
        }

        /* شاشة تتبع حالة الطلب */
        .status-wrapper {
            text-align: center;
            padding: 20px 10px;
        }

        .order-id-badge {
            font-size: 18px;
            color: var(--text-secondary);
            background: #e9ecef;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .status-display-box {
            font-size: 20px;
            font-weight: 700;
            padding: 16px 30px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .status-preparing { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-ready { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-delivered { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }

        .status-description {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .admin-panel {
            background: #f1f3f5;
            border-radius: var(--radius-md);
            padding: 16px;
            margin-top: 20px;
            text-align: right;
            border: 1px solid #dee2e6;
        }

        .admin-panel h4 {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .admin-actions .btn {
            padding: 8px 5px;
            font-size: 12px;
            text-align: center;
        }

        /* رسائل الحالة الفارغة */
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>تكة ماركت</h1>
        <p>نظام الطلبات الفوري والمتقدم</p>
    </header>

    <div class="main-content">
        <!-- واجهة القائمة والطلب الرئيسية -->
        <div id="menuView" class="view-section active">
            <div class="section-title"><span>📂</span> اختر القسم:</div>
            
            <div class="categories-grid">
                <div class="category-card" id="cat-market" onclick="switchCategory('market')">
                    <div class="category-img-box">
                        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232e7d32'/><text x='50' y='58' font-size='42' text-anchor='middle' fill='white'>🛒</text></svg>" alt="كيمارت">
                    </div>
                    <span>كيمارت</span>
                </div>
                
                <div class="category-card" id="cat-coffee" onclick="switchCategory('coffee')">
                    <div class="category-img-box">
                        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%236d4c41'/><text x='50' y='58' font-size='42' text-anchor='middle' fill='white'>☕</text></svg>" alt="المشروبات الساخنة">
                    </div>
                    <span>المشروبات الساخنة</span>
                </div>
            </div>

            <div class="section-title"><span>🛍️</span> المنتجات المتوفرة:</div>
            <div class="products-container" id="productsList">
                <!-- يتم تعبئة المنتجات هنا برمجياً مع دعم الحفظ المستمر -->
            </div>

            <div class="cart-section">
                <div class="section-title" style="margin-bottom: 10px;"><span>🛒</span> سلة الطلبات الحالية:</div>
                <div class="cart-items-list" id="cartItemsContainer">
                    <div class="empty-state">السلة فارغة حالياً</div>
                </div>
                
                <div class="cart-summary">
                    <span>المجموع الإجمالي:</span>
                    <span><span id="cartTotalPrice">0</span> ر.س</span>
                </div>

                <button class="btn btn-accent btn-block" onclick="processCheckout()">إتمام الطلب الآن</button>
            </div>
        </div>

        <!-- واجهة تتبع الحالة ولوحة التحكم -->
        <div id="statusView" class="view-section">
            <div class="status-wrapper">
                <div class="order-id-badge" id="displayOrderId">TK-00000</div>
                
                <div>
                    <div id="statusBadgeElement" class="status-display-box status-preparing">قيد التجهيز</div>
                </div>
                
                <p class="status-description" id="statusDescriptionText">جاري العمل على تجهيز طلبك بعناية فائقة، ترقب الإشعار القادم.</p>

                <div class="admin-panel">
                    <h4>لوحة تحكم حالة الطلب (إدارة المتاجر):</h4>
                    <div class="admin-actions">
                        <button class="btn" style="background:#e0a800;" onclick="updateOrderStatus('preparing')">تجهيز الطلب</button>
                        <button class="btn" style="background:#28a745;" onclick="updateOrderStatus('ready')">جاهز للاستلام</button>
                        <button class="btn" style="background:#007bff;" onclick="updateOrderStatus('delivered')">تم التسليم</button>
                    </div>
                </div>

                <button class="btn btn-block" style="margin-top: 25px; background: #495057;" onclick="startNewOrder()">بدء طلب جديد 🔄</button>
            </div>
        </div>
    </div>
</div>

<script>
    /* ========================================================
       نظام قاعدة البيانات المحلية والتخزين الدائم (LocalStorage)
       ======================================================== */
    const STORAGE_KEYS = {
        PRODUCTS: 'tek_market_products_v2',
        CART: 'tek_market_cart_v2',
        ORDER_ID: 'tek_market_order_id_v2',
        STATUS: 'tek_market_order_status_v2'
    };

    // القائمة الافتراضية الشاملة
    const initialDatabase = {
        market: [
            { id: 101, name: 'حليب المراعي الطازج (1 لتر)', price: 7 },
            { id: 102, name: 'بسكويت شوكولاتة فاخر', price: 3 },
            { id: 103, name: 'مياه معدنية نقية (عبوة)', price: 1 },
            { id: 104, name: 'شيبس بطاطس مقرمش', price: 4 }
        ],
        coffee: [
            { id: 201, name: 'لاتيه حار (Hot Latte)', price: 18 },
            { id: 202, name: 'كابتشينو كلاسيكي', price: 16 },
            { id: 203, name: 'قهوة تركية على الصاج', price: 12 },
            { id: 204, name: 'إسبريسو مركز', price: 10 }
        ]
    };

    // تهيئة المنتجات في التخزين الدائم إذا لم تكن موجودة
    if (!localStorage.getItem(STORAGE_KEYS.PRODUCTS)) {
        localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(initialDatabase));
    }

    let database = JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS));
    let shoppingCart = JSON.parse(localStorage.getItem(STORAGE_KEYS.CART)) || [];
    let activeCategory = 'market';
    let currentOrderId = localStorage.getItem(STORAGE_KEYS.ORDER_ID) || '';
    let currentOrderStatus = localStorage.getItem(STORAGE_KEYS.STATUS) || 'preparing';

    /* ========================================================
       وظائف إدارة المنتجات والعرض
       ======================================================== */
    function switchCategory(categoryName) {
        activeCategory = categoryName;
        
        // تحديث التصميم البصري للأزرار
        document.querySelectorAll('.category-card').forEach(card => {
            card.classList.remove('selected');
        });
        document.getElementById(`cat-${categoryName}`).classList.add('selected');

        renderProductsList();
    }

    function renderProductsList() {
        const container = document.getElementById('productsList');
        container.innerHTML = '';

        const items = database[activeCategory];

        if (!items || items.length === 0) {
            container.innerHTML = `<div class="empty-state">لا توجد منتجات مضافة في هذا القسم حالياً.</div>`;
            return;
        }

        items.forEach(product => {
            container.innerHTML += `
                <div class="product-item">
                    <div class="product-info">
                        <h4>${product.name}</h4>
                        <p>${product.price} ريال سعودي</p>
                    </div>
                    <button class="btn" onclick="addItemToCart(${product.id}, '${product.name}', ${product.price})">إضافة +</button>
                </div>
            `;
        });
    }

    /* ========================================================
       وظائف سلة التسوق الذكية مع الحفظ الفوري
       ======================================================== */
    function addItemToCart(id, name, price) {
        shoppingCart.push({ id, name, price });
        persistCartData();
        renderCartUI();
    }

    function persistCartData() {
        localStorage.setItem(STORAGE_KEYS.CART, JSON.stringify(shoppingCart));
    }

    function renderCartUI() {
        const container = document.getElementById('cartItemsContainer');
        const totalPriceElement = document.getElementById('cartTotalPrice');

        if (shoppingCart.length === 0) {
            container.innerHTML = `<div class="empty-state">السلة فارغة حالياً</div>`;
            totalPriceElement.innerText = '0';
            return;
        }

        container.innerHTML = '';
        let calculatedTotal = 0;

        shoppingCart.forEach((item, index) => {
            calculatedTotal += item.price;
            container.innerHTML += `
                <div class="cart-row">
                    <span>${item.name}</span>
                    <span><strong>${item.price} ر.س</strong></span>
                </div>
            `;
        });

        totalPriceElement.innerText = calculatedTotal;
    }

    /* ========================================================
       وظائف إدارة الطلب والحالات وتوليد الأرقام التلقائية
       ======================================================== */
    function generateDynamicOrderId() {
        const randomSequence = Math.floor(10000 + Math.random() * 90000);
        return `TK-${randomSequence}`;
    }

    function processCheckout() {
        if (shoppingCart.length === 0) {
            alert('عذراً، السلة فارغة. يرجى إضافة منتج واحد على الأقل قبل إتمام الطلب.');
            return;
        }

        // توليد رقم الطلب وحفظه تلقائياً
        currentOrderId = generateDynamicOrderId();
        localStorage.setItem(STORAGE_KEYS.ORDER_ID, currentOrderId);
        document.getElementById('displayOrderId').innerText = currentOrderId;

        // الانتقال التلقائي لشاشة تجهيز الطلب
        switchView('statusView');

        // تعيين الحالة الافتراضية
        updateOrderStatus('preparing');
    }

    function updateOrderStatus(statusKey) {
        currentOrderStatus = statusKey;
        localStorage.setItem(STORAGE_KEYS.STATUS, statusKey);

        const badge = document.getElementById('statusBadgeElement');
        const description = document.getElementById('statusDescriptionText');

        // إزالة الكلاسات السابقة
        badge.className = 'status-display-box';

        if (statusKey === 'preparing') {
            badge.classList.add('status-preparing');
            badge.innerText = 'قيد التجهيز';
            description.innerText = 'جاري تحضير وتجهيز طلبك الآن بكل عناية واهتمام...';
        } else if (statusKey === 'ready') {
            badge.classList.add('status-ready');
            badge.innerText = 'جاهز للاستلام';
            description.innerText = 'طلبك أصبح جاهزاً بالكامل، تفضل بالاستلام!';
        } else if (statusKey === 'delivered') {
            badge.classList.add('status-delivered');
            badge.innerText = 'تم التسليم بنجاح';
            description.innerText = 'شكراً لتعاملك مع تكة ماركت، نتمنى لك يوماً سعيداً!';
        }
    }

    function switchView(targetViewId) {
        document.querySelectorAll('.view-section').forEach(section => {
            section.classList.remove('active');
        });
        document.getElementById(targetViewId).classList.add('active');
    }

    function startNewOrder() {
        // تفريغ السلة والبيانات المؤقتة للطلب الجديد
        shoppingCart = [];
        localStorage.removeItem(STORAGE_KEYS.CART);
        localStorage.removeItem(STORAGE_KEYS.ORDER_ID);
        localStorage.removeItem(STORAGE_KEYS.STATUS);

        renderCartUI();
        switchView('menuView');
        switchCategory('market');
    }

    /* ========================================================
       تحميل النظام والتحقق من حالة الطلب المحفوظ مسبقاً عند الفتح
       ======================================================== */
    window.onload = function() {
        renderCartUI();
        switchCategory('market');

        // إذا كان هناك طلب سابق ولم يتم إغلاقه، يعرضه مباشرة للمستخدم
        if (localStorage.getItem(STORAGE_KEYS.ORDER_ID)) {
            currentOrderId = localStorage.getItem(STORAGE_KEYS.ORDER_ID);
            currentOrderStatus = localStorage.getItem(STORAGE_KEYS.STATUS) || 'preparing';
            
            document.getElementById('displayOrderId').innerText = currentOrderId;
            updateOrderStatus(currentOrderStatus);
            switchView('statusView');
        }
    };
</script>

</body>
</html>
